<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassino - Entrada</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    overflow: hidden;
    position: relative;
  }

  /* Fundo com padrão de cartas */
  .bg {
    position: fixed;
    inset: 0;
    /* Caminho absoluto da sua máquina */
    background-image: url('assets/fundo.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.35);
    z-index: 0;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
    z-index: 1;
  }

  /* Caixa Central com efeito de vidro fosco (Glassmorphism) */
  .container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    background: rgba(15, 15, 20, 0.6);
    border: 1px solid rgba(255, 200, 50, 0.2);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
  }

  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: 38px;
    color: #fff;
    text-align: center;
    letter-spacing: 6px;
    text-shadow: 0 0 20px rgba(255,200,50,0.5);
    margin-bottom: 5px;
  }

  h1 span { color: #f0c040; }

  .naipes {
    font-size: 22px;
    color: #f0c040;
    letter-spacing: 12px;
    opacity: 0.8;
    margin-bottom: 20px;
  }

  /* Input do Nickname */
  .input-group {
    width: 100%;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .input-group label {
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
  }

  .input-nickname {
    width: 100%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 15px;
    color: #fff;
    font-family: 'Cinzel', serif;
    font-size: 16px;
    text-align: center;
    letter-spacing: 2px;
    transition: all 0.3s;
  }

  .input-nickname:focus {
    outline: none;
    border-color: #f0c040;
    box-shadow: 0 0 15px rgba(240,192,64,0.3);
  }

  /* Botões Verticais */
  .btn-menu {
    display: block; /* Adicionado para links se comportarem como botões */
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-decoration: none;
    text-align: center;
  }

  .btn-menu:hover {
    background: rgba(255,255,255,0.1);
    border-color: #f0c040;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(240,192,64,0.15);
  }

  .btn-jogar {
    background: linear-gradient(135deg, rgba(240,192,64,0.2) 0%, rgba(240,192,64,0.05) 100%);
    border-color: rgba(240,192,64,0.5);
    color: #f0c040;
    font-size: 16px;
    font-weight: 700;
    margin-top: 10px;
  }

  .btn-jogar:hover {
    background: linear-gradient(135deg, rgba(240,192,64,0.3) 0%, rgba(240,192,64,0.1) 100%);
    box-shadow: 0 0 25px rgba(240,192,64,0.3);
    color: #fff;
  }

  .btn-sair {
    background: rgba(180, 30, 30, 0.15);
    border-color: rgba(220,50,50,0.3);
    color: #ff8080;
    margin-top: 10px;
  }

  .btn-sair:hover {
    background: rgba(220, 50, 50, 0.3);
    border-color: #ff5555;
    color: #fff;
  }

  /* Animações de Entrada */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .container > * { animation: fadeUp 0.6s ease both; }
  .container > *:nth-child(1) { animation-delay: 0.0s; }
  .container > *:nth-child(2) { animation-delay: 0.1s; }
  .container > *:nth-child(3) { animation-delay: 0.2s; }
  .container > *:nth-child(4) { animation-delay: 0.3s; }
  .container > *:nth-child(5) { animation-delay: 0.4s; }
  .container > *:nth-child(6) { animation-delay: 0.5s; }
</style>
</head>
<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">
  <h1>Carta<span>ralho</span></h1>
  <div class="naipes">♠ ♥ ♦ ♣</div>

  <div class="input-group">
    <label for="nickname">Identifique-se</label>
    <input type="text" id="nickname" class="input-nickname" placeholder="Digite seu nome..." autocomplete="off">
  </div>

  <button class="btn-menu btn-jogar" onclick="entrarNoCassino()">▶ ENTRAR</button>
  
  <!-- Aqui está a mudança principal! -->
  <a href="creditos.html" class="btn-menu">CRÉDITOS</a>
  
  <button class="btn-menu btn-sair" onclick="window.close()">✕ SAIR</button>
</div>

<script>
  function entrarNoCassino() {
    const nome = document.getElementById('nickname').value;
    
    // 1. Guarda o nome na memória do navegador de forma síncrona
    if (nome.trim() !== "") {
        localStorage.setItem('jogador_nickname', nome);
    } else {
        localStorage.setItem('jogador_nickname', 'Anônimo');
    }
    
    // 2. SÓ DEPOIS de guardar, muda de ecrã para a seleção de jogos
    window.location.href = "menu.html";
  }
</script>
</body>
</html>
