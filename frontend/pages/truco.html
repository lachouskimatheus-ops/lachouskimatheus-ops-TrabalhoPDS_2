<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coletânea de Jogos - Truco</title>
    <link rel="stylesheet" href="/css/truco_style.css">
</head>

<body>
    <div class="mesa-de-pano-verde">
        <div id="indicador-turno" class="indicador-turno aguardando">
            <span class="indicador-turno-rotulo">Status da partida</span>
            <strong id="indicador-turno-texto">Conectando ao servidor</strong>
            <span id="indicador-turno-fase" class="indicador-turno-fase">Aguarde...</span>
        </div>

        <div id="cadeira-esquerda" class="assento-oponente"></div>
        <div id="cadeira-topo" class="assento-oponente"></div>
        <div id="cadeira-direita" class="assento-oponente"></div>

        <div id="placar" class="placar">
            <div class="placar-equipe">
                <span id="nome-equipe-1" class="placar-label">Equipe 1</span>
                <span id="pontos-eq1" class="placar-pontos">0</span>
            </div>

            <div class="placar-separador">×</div>

            <div class="placar-equipe">
                <span id="pontos-eq2" class="placar-pontos">0</span>
                <span id="nome-equipe-2" class="placar-label">Equipe 2</span>
            </div>
        </div>

        <div class="centro-da-mesa">
            <div class="painel-vira">
                <h3>Vira</h3>
                <div id="carta-vira" class="carta carta-vazia">?</div>
            </div>

            <div class="info-mao">
                <h3>Mão vale</h3>
                <div id="valor-mao" class="valor-mao-badge">1</div>
                <div id="queda-atual" class="queda-label">1ª queda</div>
            </div>

            <div class="vaza-atual">
                <h3>Cartas na mesa</h3>
                <div id="cartas-na-mesa" class="linhas-cartas"></div>
            </div>
        </div>

        <div id="cadeira-base" class="assento-local area-jogador-local">
            <div id="minha-mao" class="mao-jogador"></div>

            <div id="status-local" class="status-box">
                <div class="info-local">
                    <h2 id="nome-local">Você</h2>

                    <div class="dados-local">
                        <p>Equipe: <strong id="local-equipe">-</strong></p>
                        <p>Quedas: <strong id="local-quedas">0</strong></p>
                    </div>
                </div>

                <div id="painel-acoes" class="painel-acoes escondido">
                    <p id="titulo-acao" class="titulo-acao">Sua vez:</p>
                    <div id="botoes-acao" class="botoes-acao"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-entrada" class="modal-overlay">
        <div class="modal-conteudo modal-entrada-conteudo">
            <div class="simbolos-naipes">♠ ♥ ♦ ♣</div>
            <h2>Entrar na sala</h2>

            <p id="codigo-sala-entrada" class="codigo-sala-entrada"></p>

            <label class="campo-label" for="input-nome">Seu nome</label>
            <input id="input-nome" class="campo-entrada" type="text" maxlength="20" placeholder="Digite seu nome">

            <label class="campo-label">Escolha sua equipe</label>

            <div class="botoes-equipe">
                <button type="button" class="btn-equipe selecionado" data-equipe="1">
                    Equipe 1
                </button>

                <button type="button" class="btn-equipe" data-equipe="2">
                    Equipe 2
                </button>
            </div>

            <p id="erro-entrada" class="erro-entrada"></p>

            <button type="button" id="btn-entrar-jogo" class="btn-confirmar-entrada">
                Entrar
            </button>

            <a href="/pages/truco_config.html" class="link-voltar-lobby">
                Voltar
            </a>
        </div>
    </div>

    <div id="modal-espera" class="modal-overlay modal-oculto">
        <div class="modal-conteudo modal-espera-conteudo">
            <h2>Aguardando jogadores</h2>
            <p id="info-jogadores-espera">Aguardando entrada na sala...</p>
            <div class="pontinhos">•••</div>
        </div>
    </div>

    <div id="modal-notificacao" class="modal-overlay modal-oculto">
        <div id="modal-texto" class="modal-conteudo"></div>
    </div>

    <script src="/js/truco_app.js"></script>
</body>
</html>
