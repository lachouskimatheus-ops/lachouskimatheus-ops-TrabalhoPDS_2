<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Coletânea de Jogos - Fodinha (FDP)</title>
    <link rel="stylesheet" href="/css/fdp_style.css">
</head>
<body>

    <div id="painel-conexao" class="painel-conexao desconectado">
        <div class="painel-conexao-linha">
            <span class="indicador-conexao"></span>
            <strong id="texto-conexao">Conectando...</strong>
        </div>

        <span id="texto-jogadores">
        Jogadores: 0/4
        </span>

        <span id="texto-turno">
        Aguardando jogadores
        </span>
    </div>

    <!-- A Mesa Verde que envelopa todo o jogo -->
    <div class="mesa-de-pano-verde">
        
        <!-- Cadeiras dos Oponentes -->
        <div id="cadeira-esquerda" class="assento-oponente"></div>
        <div id="cadeira-topo" class="assento-oponente"></div>
        <div id="cadeira-direita" class="assento-oponente"></div>

        <!-- Centro da Mesa -->
        <div class="centro-da-mesa">
            
            <!-- O Baralho Físico no Centro -->
            <div id="baralho-central" class="baralho-visual">
                <div class="verso-grande empilhada" style="bottom: 8px; right: 8px; box-shadow: none;"></div>
                <div class="verso-grande empilhada" style="bottom: 4px; right: 4px; box-shadow: none;"></div>
                <div class="verso-grande empilhada" style="bottom: 0; right: 0;"></div>
            </div>

            <div class="painel-vira">
                <h3>Vira</h3>
                <!-- A carta vira receberá rotação direto pelo CSS -->
                <div id="carta-vira" class="carta"></div>
            </div>
            
            <div class="vaza-atual">
                <h3>Cartas na Mesa</h3>
                <div id="cartas-na-mesa" class="linhas-cartas"></div>
            </div>
        </div>

        <!-- A sua cadeira (Sempre fixa na base da tela) -->
        <div id="cadeira-base" class="assento-local area-jogador-local">
            
            <!-- Suas Cartas -->
            <div id="minha-mao" class="mao-jogador"></div>

            <!-- Status do Jogador Local -->
            <div id="status-local" class="status-box">
                <div class="info-local">
                    <h2>Você (Jogador)</h2>
                    <div class="dados-local">
                        <p>Vidas: <strong id="local-vidas">5</strong></p>
                        <p>Aposta: <strong id="local-aposta">?</strong> / Feitas: <strong id="local-ganhas">0</strong></p>
                    </div>
                </div>
                
                <div id="painel-apostas" class="escondido">
                    <p class="titulo-aposta">Faça sua aposta:</p>
                    <div id="botoes-aposta" class="botoes-aposta"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Botão de Engrenagem substituído pelo Pincel (Personalização) -->
    <button id="btn-config" class="btn-config" onclick="abrirConfig()">🖌️</button>

    <!-- Modal de Configurações -->
    <div id="modal-config" class="modal-overlay modal-oculto">
        <div class="modal-conteudo">
            <h2>Personalização</h2>
            
            <h3>Seu Avatar</h3>
            <div class="avatares-container">
                <img src="/assets/avatares/avatar_1.png" class="avatar-opcao" onclick="mudarAvatar(1)" id="opt-avatar-1" alt="Avatar 1">
                <img src="/assets/avatares/avatar_2.png" class="avatar-opcao" onclick="mudarAvatar(2)" id="opt-avatar-2" alt="Avatar 2">
                <img src="/assets/avatares/avatar_3.png" class="avatar-opcao" onclick="mudarAvatar(3)" id="opt-avatar-3" alt="Avatar 3">
                <img src="/assets/avatares/avatar_4.png" class="avatar-opcao" onclick="mudarAvatar(4)" id="opt-avatar-4" alt="Avatar 4">
            </div>

            <h3>Verso das Cartas</h3>
            <div class="opcoes-container">
                <button class="btn-tema" onclick="mudarVerso('verso1')">Padrão</button>
                <button class="btn-tema" onclick="mudarVerso('verso2')">Dark</button>
                <button class="btn-tema" onclick="mudarVerso('verso3')">Minimal</button>
            </div>

            <h3>Frente das Cartas (Baralhos)</h3>
            <div class="opcoes-container">
                <button class="btn-tema" onclick="mudarBaralho('padrao')">Padrão</button>
                <button class="btn-tema" onclick="mudarBaralho('classico')">Clássico</button>
                <button class="btn-tema" onclick="mudarBaralho('medieval')">Medieval</button>
            </div>
            
            <button class="btn-fechar" onclick="fecharConfig()">Confirmar e Fechar</button>
        </div>
    </div>

    <!-- Modal Dinâmico de Notificações -->
    <div id="modal-notificacao" class="modal-overlay modal-oculto">
        <div class="modal-conteudo" id="modal-texto">
            <!-- Injetado pelo JS -->
        </div>
    </div>

    <script src="/js/fdp_app.js"></script>
</body>
</html>
