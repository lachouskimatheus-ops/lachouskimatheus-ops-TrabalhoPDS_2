<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pife</title>
    <link rel="stylesheet" href="/css/pife_style.css">
</head>
<body>

    <div class="mesa-de-pano-verde">

        <!-- CADEIRAS DOS OPONENTES (Renderizadas dinamicamente pelo JS) -->
        <div id="cadeira-esquerda" class="assento-lateral"></div>
        <div id="cadeira-topo" class="assento-topo"></div>
        <div id="cadeira-direita" class="assento-lateral"></div>

        <div class="centro-da-mesa">

            <div class="grupo-monte-vira">
                <h3>Monte & Vira</h3>
                <div class="deck-wrapper">
                    <!-- O Vira -->
                    <div id="carta-vira" class="area-vira-under">
                        <div class="carta carta-vazia">Vira</div>
                    </div>

                    <!-- O Monte -->
                    <div id="monte-compra" class="baralho-visual interativo">
                        <div class="verso-grande empilhada" style="bottom: 8px; right: 8px;"></div>
                        <div class="verso-grande empilhada" style="bottom: 4px; right: 4px;"></div>
                        <div class="verso-grande empilhada" style="bottom: 0; right: 0;"></div>
                    </div>
                </div>
                <p class="texto-coringa">Coringa: <strong id="carta-coringa">aguardando</strong></p>
            </div>

            <!-- Área de Descarte -->
            <div class="descarte-area">
                <h3>Mesa / Descarte</h3>
                <div id="mesa-descarte" class="area-descarte interativo dropzone">
                    <div class="carta carta-vazia">Descarte</div>
                </div>
            </div>

            <div class="acoes-jogo">
                <button id="btn-bater">Bater</button>
                <button id="btn-organizar">Organizar</button>
            </div>

        </div>

        <div id="area-jogador-local" class="area-jogador-local">

            <h3 class="titulo-mao">Minha mão</h3>

            <div id="minha-mao" class="mao-jogador">
                <!-- Cartas injetadas via JS -->
            </div>

            <div class="status-box">
                <div class="info-local">
                    <h2>Você</h2>
                    <div class="dados-local">
                        <p>Cartas na mão: <strong id="qtd-cartas">0</strong></p>
                        <p>Turno: <strong id="jogador-atual">Aguardando...</strong></p>
                    </div>
                </div>
                <div class="info-ajuda">
                    <p id="mensagem-ajuda">Arraste uma carta ou clique nela e na mesa para descartar.</p>
                </div>
            </div>

        </div>

    </div>

    <div id="modal-notificacao" class="modal-overlay modal-oculto">
        <div class="modal-conteudo" id="modal-texto"></div>
    </div>

    <script src="/js/pife_app.js"></script>

</body>
</html>
